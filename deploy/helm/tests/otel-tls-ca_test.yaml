# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test for otel.tls_ca (custom CA for the OTLP endpoint)
templates:
  - events-collector-config-map.yaml
  - events-collector-statefulset.yaml
  - gateway/gateway-config-map.yaml
  - gateway/gateway-statefulset.yaml
  - metrics-collector-config-map.yaml
  - metrics-deployment.yaml
  - metrics-discovery-config-map.yaml
  - metrics-discovery-deployment.yaml
  - node-collector-config-map-windows.yaml
  - node-collector-config-map.yaml
  - node-collector-daemon-set-windows.yaml
  - node-collector-daemon-set.yaml
  - operator/discovery-collector-config-map.yaml
  - operator/discovery-collector.yaml
  - otel-ca-config-map.yaml
  - common-env-config-map.yaml
  - metrics-collector-env-config-map.yaml
chart:
  appVersion: 1.0.0
tests:
  - it: node-collector-daemon-set has no CA volume or mount by default
    template: node-collector-daemon-set.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name=='otel-ca')]
      - notExists:
          path: spec.template.spec.volumes[?(@.name=='otel-ca')]
  - it: node-collector-daemon-set mounts the existing ConfigMap with configmap_key
    template: node-collector-daemon-set.yaml
    set:
      otel.tls_ca.configmap: my-ca
      otel.tls_ca.configmap_key: bundle.pem
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
            configMap:
              name: my-ca
              items:
                - key: bundle.pem
                  path: ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: otel-ca
            mountPath: /otel-ca
            readOnly: true
  - it: node-collector-daemon-set mounts the chart-made ConfigMap with pem
    template: node-collector-daemon-set.yaml
    set:
      otel.tls_ca.pem: |
        -----BEGIN CERTIFICATE-----
        abc
        -----END CERTIFICATE-----
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-ca
            configMap:
              name: RELEASE-NAME-swo-k8s-collector-otel-ca
              items:
                - key: ca.crt
                  path: ca.crt
  - it: node-collector-config-map.yaml has ca_file only with the right path
    template: node-collector-config-map.yaml
    set:
      otel.tls_ca.configmap: my-ca
    asserts:
      - matchRegex:
          path: data["logs.config"]
          pattern: '(?m)^      ca_file: /otel-ca/ca\.crt$'
      - matchRegex:
          path: data["logs.config"]
          pattern: 'solarwinds:[\s\S]*ca_file: /otel-ca/ca\.crt'
      - notMatchRegex:
          path: data["logs.config"]
          pattern: 'ca_file: c:\\otel-ca\\ca.crt'
  - it: node-collector-config-map.yaml has no ca_file by default
    template: node-collector-config-map.yaml
    asserts:
      - notMatchRegex:
          path: data["logs.config"]
          pattern: 'otel-ca'
  - it: node-collector-daemon-set renders no CA when tls_insecure is set
    template: node-collector-daemon-set.yaml
    set:
      otel.tls_insecure: true
      otel.tls_ca.configmap: my-ca
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name=='otel-ca')]
      - notExists:
          path: spec.template.spec.volumes[?(@.name=='otel-ca')]
  - it: node-collector-daemon-set-windows has no CA volume or mount by default
