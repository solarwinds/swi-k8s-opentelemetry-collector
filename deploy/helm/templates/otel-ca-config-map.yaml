{{- if and .Values.otel.tls_ca.pem (eq (include "common.otel-ca-enabled" .) "true") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.otel-ca-configmap-name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
  annotations:
{{ include "common.annotations" . | indent 4 }}
data:
  ca.crt: |
{{ .Values.otel.tls_ca.pem | trim | indent 4 }}
{{- end }}
